[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chipwhisperer-studio"
dynamic = ["version"]
description = "Desktop app for ChipWhisperer hardware: live waveforms, capture, CPA, glitching and firmware builds"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Keyur Aghao"}]
requires-python = ">=3.10"
dependencies = [
    "chipwhisperer>=6.0",
    "numpy>=1.24",
    "starlette>=0.37",
    "uvicorn>=0.27",
    "websockets>=12",
    "truststore>=0.9",
    "certifi",
    "matplotlib>=3.7",
    "tqdm",
    # Code map: ELF/DWARF parsing, and the CPU emulator for Arm Cortex-M and RISC-V firmware (AVR runs in Studio's own emulator)
    "pyelftools>=0.30",
    "unicorn>=2.0.1",
    # Studio's own window: Edge WebView2 on Windows and WebKit on macOS through pywebview. Linux uses the distribution's WebKitGTK through the system Python, so it needs nothing here.
    "pywebview>=5; sys_platform == 'win32' or sys_platform == 'darwin'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
window = []  # the window is built in now; kept so "chipwhisperer-studio[window]" still installs
test = ["pytest", "httpx"]
# The official MCP SDK is only used by the interoperability test; Studio has its own MCP server.
test-mcp = ["pytest", "httpx", "mcp>=2.2"]

[project.scripts]
cw-studio = "cwstudio.cli:main"
cw-studio-web = "cwstudio.cli:main_web"

[project.urls]
Repository = "https://github.com/keyuraghao/chipwhisperer-studio"

[tool.setuptools.dynamic]
version = {attr = "cwstudio.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cwstudio = ["static/*", "static/**/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
