[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chipwhisperer-studio"
dynamic = ["version"]
description = "Desktop app for ChipWhisperer hardware: live waveforms, capture, CPA, glitch sweeps, UART/SPI/JTAG/SWD interfaces, a logic analyser, firmware code on the power trace, notebooks, firmware builds and an MCP server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Keyur Aghao"}]
keywords = ["chipwhisperer", "side-channel", "power-analysis", "fault-injection", "glitching", "cpa", "hardware-security", "logic-analyzer", "protocol-decoder", "jtag", "swd", "oscilloscope", "embedded", "firmware", "mcp"]
requires-python = ">=3.10"
dependencies = [
    "chipwhisperer>=6.0",
    "numpy>=1.24",
    "starlette>=0.37",
    "uvicorn>=0.27",
    "websockets>=12",
    "truststore>=0.9",
    "certifi",
    "matplotlib>=3.7",
    "tqdm",
    # Code map: ELF/DWARF parsing, and the CPU emulator for Arm Cortex-M and RISC-V firmware (AVR runs in Studio's own emulator)
    "pyelftools>=0.30",
    "unicorn>=2.0.1",
    # Studio's own window: Edge WebView2 on Windows and WebKit on macOS through pywebview. Linux uses the distribution's WebKitGTK through the system Python, so it needs nothing here.
    "pywebview>=5; sys_platform == 'win32' or sys_platform == 'darwin'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Environment :: X11 Applications :: GTK",
    "Environment :: MacOS X :: Cocoa",
    "Environment :: Win32 (MS Windows)",
    "Framework :: Jupyter",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
window = []  # the window is built in now; kept so "chipwhisperer-studio[window]" still installs
test = ["pytest", "httpx"]
# The official MCP SDK is only used by the interoperability test; Studio has its own MCP server.
test-mcp = ["pytest", "httpx", "mcp>=2.2"]

[project.scripts]
cw-studio = "cwstudio.cli:main"
cw-studio-web = "cwstudio.cli:main_web"

[project.urls]
Homepage = "https://github.com/keyuraghao/chipwhisperer-studio"
Documentation = "https://github.com/keyuraghao/chipwhisperer-studio/wiki"
Repository = "https://github.com/keyuraghao/chipwhisperer-studio"
Issues = "https://github.com/keyuraghao/chipwhisperer-studio/issues"
Changelog = "https://github.com/keyuraghao/chipwhisperer-studio/blob/main/CHANGELOG.md"
"Video tour" = "https://github.com/keyuraghao/chipwhisperer-studio/wiki/Video-Tour"

[tool.setuptools.dynamic]
version = {attr = "cwstudio.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cwstudio = ["static/*", "static/**/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
