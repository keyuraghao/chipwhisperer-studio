name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The Python 3.10 job installs only the plain test extra, so an accidental import of the MCP SDK or its dependencies fails CI; the others also run the official MCP client interop test.
      - run: pip install -e ".[${{ matrix.python == '3.10' && 'test' || 'test-mcp' }}]"
      - run: python -m pytest -q

  docs:
    # README and DESIGN links and images resolve, and no em dashes anywhere in the text (the project's style rule).
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links and style
        run: |
          set -e
          if git grep -nI $'\u2014'; then echo "em dash found"; exit 1; fi
          python3 - <<'EOF'
          import os, re, sys
          bad = []
          for doc in ("README.md", "docs/DESIGN.md", "CHANGELOG.md", "packaging/BUNDLE_README.md"):
              base = os.path.dirname(doc)
              text = open(doc, encoding="utf-8").read()
              for target in re.findall(r"\]\(([^)\s#]+)(?:#[^)]*)?\)", text) + re.findall(r'(?:src|srcset)="([^"#]+)"', text):
                  if not target.startswith(("http://", "https://", "mailto:")) and not os.path.exists(os.path.join(base, target)):
                      bad.append(f"{doc}: missing {target}")
          print("\n".join(bad) or "links ok")
          if bad:
              sys.exit(1)
          EOF
          python3 tools/theme_images.py --check

  firmware:
    # Exercises the real toolchain downloads and ChipWhisperer makefiles on every OS.
    name: Firmware build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Install toolchains, fetch sources, build with GCC and clang
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import os, sys
          from cwstudio.toolchains import ToolchainManager
          from cwstudio.firmware import FirmwareManager
          data = os.path.join(os.getcwd(), "build", "fw-ci")
          tm = ToolchainManager(data)
          fm = FirmwareManager(data, tm)
          needed = ["arm-gcc", "avr-gcc", "clang"] + (["win-build-tools"] if os.name == "nt" else [])
          for tc in needed:
              st = tm.install(tc, wait=True)
              print(tc, "installed" if st["installed"] else st["job"])
              assert st["installed"], tc
          src = fm.fetch_sources(wait=True)
          print("sources", src["installed"]["commit"][:8], src["installed"]["ref"])
          assert src["installed"]["message"] != "known good fallback", "GitHub lookup failed"
          failed = []
          for platform, compiler in [("CWLITEARM", "gcc"), ("CWLITEARM", "clang"), ("CWLITEXMEGA", "gcc"), ("CWLITEXMEGA", "clang"), ("CWHUSKY", "gcc")]:
              r = fm.build({"project": "simpleserial-aes", "platform": platform, "compiler": compiler, "ss_ver": "SS_VER_2_1"}, wait=True)
              print(f"{platform:12} {compiler:6} {r['state']:8} {r.get('size')} {r.get('error') or ''}")
              if r["state"] != "ok":
                  failed.append((platform, compiler))
                  print("\n".join(fm.build_log()["lines"][-40:]))
          sys.exit(1 if failed else 0)
          EOF

  bundle:
    name: Bundle (${{ matrix.os }}, ${{ matrix.variant }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
        variant: [app, web]  # app: Studio in its own window; web: Studio in the browser
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -e . "pyinstaller>=6.0" libusb-package
      - name: Build bundle
        run: python packaging/build.py --no-venv --variant ${{ matrix.variant }}
        shell: bash
      - name: Smoke test bundle (simulator, MCP entry point, compiler wrapper)
        shell: bash
        run: |
          set -e
          # Windows app build: the console executable (the windowed one has no console output); macOS: the executable inside the .app
          if [ "${{ matrix.variant }}" = "web" ]; then DIR=dist/ChipWhispererStudio-Web; APPNAME="ChipWhisperer Studio Web.app"; else DIR=dist/ChipWhispererStudio; APPNAME="ChipWhisperer Studio.app"; fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ "${{ matrix.variant }}" = "app" ]; then EXE=$DIR/cw-studio.exe; test -f $DIR/ChipWhispererStudio.exe; else EXE=$DIR/ChipWhispererStudio.exe; test ! -e $DIR/cw-studio.exe; fi
          elif [ "${{ runner.os }}" = "macOS" ]; then EXE="$DIR/$APPNAME/Contents/MacOS/ChipWhispererStudio"
          else EXE=$DIR/ChipWhispererStudio; fi
          "$EXE" mcp --help | head -3
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP="$DIR/$APPNAME"
            plutil -lint "$APP/Contents/Info.plist"
            test -s "$APP/Contents/Resources/icon.icns"
            codesign --verify --deep --verbose "$APP"
            python -c "import webview, webview.platforms.cocoa; print('pywebview cocoa backend ok')"
          fi
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.variant }}" = "app" ]; then
            python -c "import webview, webview.platforms.edgechromium; print('pywebview edgechromium backend ok')"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            XDG_DATA_HOME="$PWD/xdg" "$EXE" --install-desktop
            grep -q "^Icon=chipwhisperer-studio" xdg/applications/chipwhisperer-studio.desktop && test -s xdg/icons/hicolor/512x512/apps/chipwhisperer-studio.png
          fi
          CWSTUDIO_CC='["python", "--version"]' "$EXE" --ccwrap
          "$EXE" --no-browser --simulate --port 8799 &
          PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8799/api/status >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8799/api/meta | head -c 300; echo
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"kind":"sim"}' http://127.0.0.1:8799/api/scope/connect
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"kind":"sim"}' http://127.0.0.1:8799/api/target/connect
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"count":20}' http://127.0.0.1:8799/api/capture/start
          sleep 3
          curl -sf http://127.0.0.1:8799/api/traces
          curl -sf http://127.0.0.1:8799/api/toolchains | head -c 300; echo
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"code":"import chipwhisperer as cw\nimport matplotlib.pyplot as plt\ns = cw.scope()\nplt.plot(studio.traces.waves[0])\nprint(len(studio.traces))"}' http://127.0.0.1:8799/api/kernel/run > nb.json
          python -c "import json; r = json.load(open('nb.json')); assert r['ok'], r; assert any('image/png' in o.get('data', {}) for o in r['outputs']), r; print('notebook ok')"
          kill $PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: ChipWhispererStudio-${{ matrix.os }}-${{ matrix.variant }}
          path: dist/*.zip

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, firmware, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release notes from CHANGELOG.md
        run: python tools/release_notes.py --check "${GITHUB_REF_NAME}" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build Python packages
        run: pip install build && python -m build --outdir artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: ChipWhisperer Studio ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
