<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChipWhisperer Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232fbf9b'/%3E%3Cstop offset='1' stop-color='%232a7fd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Cpolyline points='4,16 9,16 12,7 16,25 20,11 23,19 25,16 28,16' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<script>try { const t = localStorage.getItem('cw.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* storage unavailable */ }</script>
<link rel="stylesheet" href="/static/vendor/uPlot.min.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24"><polyline points="2,12 6,12 8.5,5 12,19 15,8 17.5,15 19,12 22,12"/></svg></span>
      <span>ChipWhisperer <b>Studio</b></span>
      <span class="ver" id="app-version"></span>
    </div>
    <div class="chips">
      <div class="chip" id="chip-scope" title="Scope"><span class="dot"></span><span class="txt">No scope</span></div>
      <div class="chip" id="chip-target" title="Target"><span class="dot"></span><span class="txt">No target</span></div>
      <div class="chip" id="chip-job"><span class="dot"></span><span class="txt">Idle</span></div>
    </div>
    <div class="quick">
      <button id="btn-single" class="btn" title="Capture one trace (S)"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>Single</button>
      <button id="btn-run" class="btn primary" title="Run capture (R)"><svg class="i" viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20" fill="currentColor"/></svg>Run</button>
      <button id="btn-stop" class="btn danger" title="Stop (Esc)" disabled><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>Stop</button>
    </div>
    <div class="right">
      <span id="trace-count" class="muted">0 traces</span>
      <span id="ws-state" class="ws off" title="Live connection to Studio"></span>
      <button id="theme-toggle" class="icon-btn" title="Switch light / dark theme">
        <svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <nav id="tabs">
    <button data-tab="connect" class="tab active" title="Connect scope and target"><span class="ico"><svg class="i" viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0V8zM12 18v4"/></svg></span>Connect</button>
    <button data-tab="scope" class="tab" title="Scope settings"><span class="ico"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span>Scope</button>
    <button data-tab="target" class="tab" title="Program and talk to the target"><span class="ico"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></span>Target</button>
    <button data-tab="firmware" class="tab" title="Build firmware"><span class="ico"><svg class="i" viewBox="0 0 24 24"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6M14 4l-4 16"/></svg></span>Firmware</button>
    <button data-tab="capture" class="tab" title="Capture traces"><span class="ico"><svg class="i" viewBox="0 0 24 24"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg></span>Capture</button>
    <button data-tab="analysis" class="tab" title="CPA key recovery"><span class="ico"><svg class="i" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L21 2M16 7l3 3M19 4l2 2"/></svg></span>Analysis</button>
    <button data-tab="glitch" class="tab" title="Fault injection sweep"><span class="ico"><svg class="i" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg></span>Glitch</button>
    <div class="spacer"></div>
    <button data-tab="help" class="tab" title="Help, shortcuts and AI agent (MCP) setup"><span class="ico"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg></span>Help</button>
  </nav>

  <aside id="sidebar">
    <section id="panel-connect" class="panel active"></section>
    <section id="panel-scope" class="panel"></section>
    <section id="panel-target" class="panel"></section>
    <section id="panel-firmware" class="panel"></section>
    <section id="panel-capture" class="panel"></section>
    <section id="panel-analysis" class="panel"></section>
    <section id="panel-glitch" class="panel"></section>
    <section id="panel-help" class="panel"></section>
  </aside>

  <main id="main">
    <div id="wave-toolbar" class="toolbar"></div>
    <div id="wave-plot"></div>
    <div id="wave-footer"></div>
  </main>

  <footer id="bottom">
    <div class="bottom-head">
      <button id="log-toggle" class="link">Log</button>
      <span id="log-count" class="muted"></span>
      <div class="spacer"></div>
      <input id="log-filter" placeholder="Filter log" class="small">
      <button id="log-clear" class="btn ghost sm">Clear</button>
    </div>
    <div id="log-body"></div>
  </footer>
  <div id="toasts"></div>
</div>
<script src="/static/vendor/uPlot.iife.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
