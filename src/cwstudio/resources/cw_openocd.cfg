#
# ChipWhisperer MPSSE (JTAG/SWD) interface for OpenOCD, shipped with ChipWhisperer Studio.
# Equivalent to openocd/cw_openocd.cfg in NewAE's chipwhisperer repository.
# Studio adds the USB IDs ("ftdi vid_pid 0x2b3e <pid>": Nano 0xace0, Lite 0xace2, Pro 0xace3, Husky 0xace5, Husky Plus 0xace6), the serial number and "transport select jtag|swd" on the command line.
#

adapter driver ftdi
ftdi channel 1
ftdi layout_init 0x001B 0x001B
ftdi layout_signal nSRST -data 0x0010
ftdi layout_signal SWD_EN -data 0x0100
ftdi layout_signal SWDIO_OE -data 0x0200
adapter speed 500
reset_config srst_push_pull
