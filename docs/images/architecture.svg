<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ChipWhisperer Studio architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="720" rx="16" fill="#f8fafc"/>

  <!-- clients -->
  <g filter="url(#sh)">
    <rect x="80" y="30" width="260" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="470" y="30" width="260" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="860" y="30" width="260" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="210" y="61" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Browser UI</text>
  <text x="210" y="83" text-anchor="middle" font-size="12.5" fill="#64748b">live waveform, settings, firmware</text>
  <text x="600" y="61" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">AI agent</text>
  <text x="600" y="83" text-anchor="middle" font-size="12.5" fill="#64748b">Claude, Cursor, any MCP client</text>
  <text x="990" y="61" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Scripts and CI</text>
  <text x="990" y="83" text-anchor="middle" font-size="12.5" fill="#64748b">plain HTTP, /api/docs</text>

  <!-- process -->
  <rect x="40" y="140" width="1120" height="420" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="60" y="166" font-size="12.5" font-weight="600" fill="#475569" letter-spacing="0.6">CHIPWHISPERER STUDIO PROCESS</text>

  <rect x="470" y="180" width="260" height="50" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="600" y="203" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4c1d95">MCP server</text>
  <text x="600" y="220" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-family="ui-monospace, Menlo, Consolas, monospace">mcp_server.py  ·  54 tools</text>

  <rect x="80" y="258" width="1040" height="54" rx="9" fill="#e6f7f2" stroke="#12a383"/>
  <text x="600" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#065f46">HTTP API and WebSocket</text>
  <text x="600" y="300" text-anchor="middle" font-size="11.5" fill="#047857" font-family="ui-monospace, Menlo, Consolas, monospace">app.py (REST + /ws)  ·  events.py (live traces, logs, progress)</text>

  <rect x="80" y="330" width="1040" height="44" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="357" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-weight="600">Session state</tspan><tspan fill="#64748b" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">   session.py  ·  traces.py  ·  settings.py</tspan></text>

  <g filter="url(#sh)">
    <rect x="80" y="394" width="245" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="345" y="394" width="245" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="610" y="394" width="245" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="875" y="394" width="245" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="80" y="394" width="245" height="6" rx="3" fill="#2f7de1"/>
  <rect x="345" y="394" width="245" height="6" rx="3" fill="#e07a12"/>
  <rect x="610" y="394" width="245" height="6" rx="3" fill="#12a383"/>
  <rect x="875" y="394" width="245" height="6" rx="3" fill="#7c3aed"/>

  <text x="100" y="427" font-size="15" font-weight="600" fill="#0f172a">Hardware worker</text>
  <text x="100" y="448" font-size="12" fill="#475569">The only thread that touches USB.</text>
  <text x="100" y="466" font-size="12" fill="#475569">Capture and glitch jobs interleave</text>
  <text x="100" y="484" font-size="12" fill="#475569">with settings, serial and programming.</text>
  <text x="100" y="515" font-size="11" fill="#64748b" font-family="ui-monospace, Menlo, Consolas, monospace">worker.py capture.py glitch.py</text>

  <text x="365" y="427" font-size="15" font-weight="600" fill="#0f172a">CPA analysis</text>
  <text x="365" y="448" font-size="12" fill="#475569">Progressive correlation attack on</text>
  <text x="365" y="466" font-size="12" fill="#475569">stored traces, own thread, never</text>
  <text x="365" y="484" font-size="12" fill="#475569">blocks the hardware.</text>
  <text x="365" y="515" font-size="11" fill="#64748b" font-family="ui-monospace, Menlo, Consolas, monospace">analysis.py</text>

  <text x="630" y="427" font-size="15" font-weight="600" fill="#0f172a">Toolchains</text>
  <text x="630" y="448" font-size="12" fill="#475569">Pinned compilers downloaded on</text>
  <text x="630" y="466" font-size="12" fill="#475569">demand, SHA-256 verified, mirrors,</text>
  <text x="630" y="484" font-size="12" fill="#475569">custom entries, offline afterwards.</text>
  <text x="630" y="515" font-size="11" fill="#64748b" font-family="ui-monospace, Menlo, Consolas, monospace">toolchains.py</text>

  <text x="895" y="427" font-size="15" font-weight="600" fill="#0f172a">Firmware builds</text>
  <text x="895" y="448" font-size="12" fill="#475569">ChipWhisperer makefiles with GCC,</text>
  <text x="895" y="466" font-size="12" fill="#475569">or clang through the wrapper; the</text>
  <text x="895" y="484" font-size="12" fill="#475569">.hex goes to the worker to flash.</text>
  <text x="895" y="515" font-size="11" fill="#64748b" font-family="ui-monospace, Menlo, Consolas, monospace">firmware.py ccwrap.py</text>

  <!-- external -->
  <g filter="url(#sh)">
    <rect x="80" y="600" width="245" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="610" y="600" width="245" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="875" y="600" width="245" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="202" y="628" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">chipwhisperer library</text>
  <text x="202" y="648" text-anchor="middle" font-size="12" fill="#475569">Nano, Lite, Pro, Husky</text>
  <text x="202" y="666" text-anchor="middle" font-size="12" fill="#475569">or the built-in simulator</text>
  <text x="732" y="628" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Official compiler releases</text>
  <text x="732" y="648" text-anchor="middle" font-size="12" fill="#475569">xPack GCC, Arduino avr-gcc,</text>
  <text x="732" y="666" text-anchor="middle" font-size="12" fill="#475569">Zig clang, Windows make</text>
  <text x="997" y="628" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">NewAE on GitHub</text>
  <text x="997" y="648" text-anchor="middle" font-size="12" fill="#475569">newaetech/chipwhisperer</text>
  <text x="997" y="666" text-anchor="middle" font-size="12" fill="#475569">firmware/mcu + fw-extra HALs</text>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <path d="M210 102 V256" marker-end="url(#arr)"/>
    <path d="M600 102 V178" marker-end="url(#arr)"/>
    <path d="M600 230 V256" marker-end="url(#arr)"/>
    <path d="M990 102 V256" marker-end="url(#arr)"/>
    <path d="M600 312 V328" marker-end="url(#arr)"/>
    <path d="M202 374 V392" marker-end="url(#arr)"/>
    <path d="M467 374 V392" marker-end="url(#arr)"/>
    <path d="M732 374 V392" marker-end="url(#arr)"/>
    <path d="M997 374 V392" marker-end="url(#arr)"/>
    <path d="M202 534 V598" marker-end="url(#arr)"/>
    <path d="M732 534 V598" marker-end="url(#arr)"/>
    <path d="M997 534 V598" marker-end="url(#arr)"/>
  </g>
  <text x="222" y="180" font-size="11.5" fill="#64748b">HTTP + WebSocket</text>
  <text x="612" y="130" font-size="11.5" fill="#64748b">stdio or HTTP</text>
  <text x="612" y="248" font-size="11.5" fill="#64748b">same API</text>
  <text x="1002" y="180" font-size="11.5" fill="#64748b">HTTP</text>
  <text x="214" y="578" font-size="11.5" fill="#64748b">USB</text>
  <text x="744" y="578" font-size="11.5" fill="#64748b">HTTPS, once</text>
  <text x="1009" y="578" font-size="11.5" fill="#64748b">HTTPS, on update</text>
</svg>
